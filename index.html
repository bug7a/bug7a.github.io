                <h1>Buğra Özden</h1>
                <p>Remote freelance web &amp; app developer, working with clients in Istanbul, across Türkiye and worldwide. Interactive web apps, custom admin panels, dashboards and advanced web forms.</p>

                <h2>Services</h2>

                <h3>Custom Admin Panels and Dashboards</h3>
                <p>A management panel made for your business: orders, customers, products, reports and live device data on one screen. Only the pages you need, in your own colors. Charts, data tables, filters and exports are ready to use, and new modules can be added later without rewriting the panel. It runs in the browser, with nothing to install. <a href="https://bug7a.github.io/admin-panel" style="color: #A78BFA;">Web page</a> · <a href="https://bug7a.github.io/admin-panel-example" style="color: #A78BFA;">Live example</a></p>

                <h3>Advanced Web Forms</h3>
                <p>Forms that do more than collect text: appointments, orders, event tickets, job applications, support requests and customer feedback. Every field checks itself while the visitor types, and the send button shows what is still missing. The answers come to your e-mail or database, and the form can be embedded in any website. <a href="https://bug7a.github.io/web-forms" style="color: #A78BFA;">Web page</a> · <a href="#contact" style="color: #A78BFA;">Live example</a></p>

                <h2>Projects</h2>

                <h3>Kodlama: Kod Yazma Eğitimi</h3>
                <p>An education app that teaches children algorithms and problem solving with a real programming language (JavaScript), in puzzle game style simulations. <a href="https://bug7a.github.io/kodlama/" style="color: #A78BFA;">Web site</a> · <a href="https://bug7a.github.io/kodlama-egitimi/" style="color: #A78BFA;">Course</a> · <a href="https://github.com/bug7a/basicjs-turkce/" style="color: #A78BFA;">Sample projects</a></p>

                <h3>The Fallen Kingdoms</h3>
                <p>A board game that combines turn-based strategy and card-drafting mechanics. A party game with "Remote Play Together" on Steam. <a href="https://store.steampowered.com/app/2923920?utm_source=bugraozden" style="color: #A78BFA;">See on Steam</a></p>

                <h3>Personal Expense Book</h3>
                <p>A mobile app to set a budget and track your spending by category. <a href="https://bug7a.github.io/expense/" style="color: #A78BFA;">Preview</a></p>

                <h3>Closed-Loop Marketing</h3>
                <p>A mobile (iOS) Closed-Loop Marketing (CLM) app for pharmaceutical sales teams, used by more than 500 medical representatives at Roche, Novo Nordisk and Boehringer Ingelheim on their doctor visits: presentations to doctors, visit data and training in one app.</p>
