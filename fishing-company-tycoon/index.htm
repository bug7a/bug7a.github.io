                <p><a href="?lang=tr" hreflang="tr" lang="tr">Türkçe</a></p>
                <h1>Fishing Company Tycoon: Harbor to Market</h1>
                <p><b>Build a fishing company from a single boat.</b> Send your ships to the fishing grounds, truck the catch to the markets that pay the most, research better gear, and grow a fleet that works by itself. A relaxed management game on a living island.</p>
                <p>In development · PC (Windows) · English and Turkish</p>
                <h2>From one small boat to the biggest fish company of the island</h2>
                <p>You start with one small boat and an empty warehouse on the east coast of an island. Around you: twenty fishing grounds, four towns that all want something different, and a harbor that is waiting for someone to make it busy.</p>
                <h3>From the harbor to the market</h3>
                <p>Catch the fish, bring it home, and decide where it goes. The local buyer pays at once, but a truck to the right town pays more: the resort wants swordfish, the factory village wants sardines. Prices fall when you flood a market and recover when you leave it alone.</p>
                <h3>A fleet that works by itself</h3>
                <p>Six kinds of ships, from the starter boat to a solar flagship. Teach them, box by box, to cast, come home, unload, refuel and go out again. Then do the same for your trucks. The more your company grows, the less you have to click.</p>
                <h3>Fish that run out, and come back</h3>
                <p>Every fishing ground has its own stock. Fish it gently and it grows back; fish it too hard and it collapses. Tuna, swordfish and bluefin wait far out at sea for ships that can reach them.</p>
                <h3>More than fish</h3>
                <p>Agreements with hotels and restaurants, a reputation to earn, crab pots, squid that only bite at night, a mussel farm, a fish farm, a canning factory with one very big order, and your own restaurants to open.</p>
                <h3>A living island</h3>
                <p>Day turns to night, the weather changes, lamps come on in the towns, and your ships keep working with their lights. Now and then a big shoal shows up, or the harbor leaves you a gift.</p>
                <h2>What is in the harbor</h2>
                <ul>
                    <li>6 ship types and 7 kinds of trucks</li>
                    <li>20 fishing grounds, 12 kinds of fish and seafood</li>
                    <li>4 towns with their own prices</li>
                    <li>10 technology columns, 11 chapters of tasks</li>
                    <li>2 languages: English, Turkish</li>
                </ul>
                <h2>System requirements</h2>
                <p>Preliminary: Windows 10 (64-bit) · dual core, 2 GHz · 4 GB RAM · any card with WebGL support · 400 MB available space</p>
