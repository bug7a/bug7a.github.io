## Kartlar: OzdenUI for Go ile ve klasik Go ile (2026-11-17)

OzdenUI for Go sitesindeki **"Düz Go ile kendi bileşeniniz"** örneği: `Card` adında bir bileşen (başlık, metin, **Open**
düğmesi), yan yana üç kart (Sales, Stock, Orders). **Open**'a basınca kartın başlığı "Opened" olur.

Go'nun kendi pencere kütüphanesi yok. Klasik yol bir kütüphane seçmek: en çok kullanılanı **Fyne**. Aşağıda aynı örnek
iki yolla yazıldı.

### 1. OzdenUI for Go ile

```go
package main

import ui "github.com/bug7a/ozdenui-go"

// Card is a component of this program: a title, a text and a button.
type Card struct {
    Box   *ui.Object
    title *ui.Object
}

// NewCard makes a card in the group it is called in.
func NewCard(title, text string, onOpen func(card *Card)) *Card {
    card := &Card{}
    card.Box = ui.VGroup(ui.Props{Width: 220, Height: "auto", Align: "left top",
        Padding: 16, Gap: 8, Color: "white", Round: 12}, func() {
        card.title = ui.Label(ui.Props{Text: title, FontSize: 18, Bold: true})
        ui.Label(ui.Props{Text: text, TextColor: "#5A6270"})
        ui.SmartButton(ui.SmartButtonProps{LabelText: "Open", OnClick: func() { onOpen(card) }})
    })
    return card
}

// SetTitle changes its title.
func (card *Card) SetTitle(title string) {
    card.title.SetText(title)
}

func main() {
    ui.Run(start, ui.Window{Title: "Cards", Width: 760, Height: 240})
}

func start(page *ui.Object) {
    page.Set("color", "#F4F5F7")
    ui.HGroup(ui.Props{Gap: 16, Padding: 24, Wrap: true}, func() {
        for _, name := range []string{"Sales", "Stock", "Orders"} {
            NewCard(name, "Updated today.", func(card *Card) {
                card.SetTitle("Opened")
            })
        }
    })
}
```

### 2. Klasik Go ile (Fyne v2.8)

```go
package main

import (
    "image/color"

    "fyne.io/fyne/v2"
    "fyne.io/fyne/v2/app"
    "fyne.io/fyne/v2/canvas"
    "fyne.io/fyne/v2/container"
    "fyne.io/fyne/v2/layout"
    "fyne.io/fyne/v2/widget"
)

// Card is a component of this program: a title, a text and a button.
type Card struct {
    Box   fyne.CanvasObject
    title *canvas.Text
}

// NewCard makes a card; the caller puts card.Box into a container.
func NewCard(title, text string, onOpen func(card *Card)) *Card {
    card := &Card{}
    card.title = canvas.NewText(title, color.Black)
    card.title.TextSize = 18
    card.title.TextStyle = fyne.TextStyle{Bold: true}
    body := canvas.NewText(text, color.NRGBA{R: 0x5A, G: 0x62, B: 0x70, A: 0xFF})
    button := widget.NewButton("Open", func() { onOpen(card) })

    background := canvas.NewRectangle(color.White)
    background.CornerRadius = 12
    content := container.NewVBox(card.title, body, container.NewHBox(button))
    padded := container.New(layout.NewCustomPaddedLayout(16, 16, 16, 16), content)
    card.Box = container.NewStack(background, padded)
    return card
}

// SetTitle changes its title.
func (card *Card) SetTitle(title string) {
    card.title.Text = title
    card.title.Refresh()
}

func main() {
    myApp := app.New()
    window := myApp.NewWindow("Cards")

    row := container.NewGridWrap(fyne.NewSize(220, 130))
    for _, name := range []string{"Sales", "Stock", "Orders"} {
        card := NewCard(name, "Updated today.", func(card *Card) {
            card.SetTitle("Opened")
        })
        row.Add(card.Box)
    }

    pageColor := canvas.NewRectangle(color.NRGBA{R: 0xF4, G: 0xF5, B: 0xF7, A: 0xFF})
    padded := container.New(layout.NewCustomPaddedLayout(24, 24, 24, 24), row)
    window.SetContent(container.NewStack(pageColor, padded))
    window.Resize(fyne.NewSize(760, 240))
    window.ShowAndRun()
}
```

Çalıştırmak için önce: `go mod init cards`, `go get fyne.io/fyne/v2@latest`, sonra `go run .`

### 3. Karşılaştırma

| | OzdenUI for Go | Fyne |
|---|---|---|
| Satır (boş satırlar hariç) | 35 | 51 |
| Kartın görünüşü | `Color`, `Round`, `Padding`, `Gap`: bir satırda | Bir dikdörtgen, bir iç boşluk düzeni, bir yığın: üç parça |
| Yan yana dizmek | `HGroup` + `Wrap: true`: kart kendi boyunu alır | `GridWrap`: her hücrenin genişliği ve **yüksekliği** önceden verilir |
| Başlığı değiştirmek | `SetText()` | `Text` değişir, sonra `Refresh()` çağrılır |
| Düğme | OzdenUI kitinin `SmartButton`'ı | Fyne temasının düğmesi |
| Pencereyi kim çizer | Sistemin web görünümü (Windows'ta WebView2) | Fyne kendisi çizer (OpenGL), web görünümü yok |
| Derlemek için | Windows'ta C derleyicisi gerekmez | Her sistemde C derleyicisi gerekir (cgo) |
| Telefon | Yok | Android ve iOS da var |
| Olgunluk | Yeni (v0.2.1) | Yıllardır kullanılıyor, büyük topluluk |

**Kısaca:** Bir arayüzü yazmak OzdenUI ile daha kısa; renk, köşe ve boşluk HTML'deki gibi tek satır. Fyne daha eski ve
daha geniş (telefon da var), ama görünüş için parçaları elle üst üste koymak gerekiyor.
