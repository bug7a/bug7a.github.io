## SSH bağlantısını kapatmak (2026-11-17)

Amaç: Mac'ten bu bilgisayara açılan terminal (SSH) bağlantısını kapatmak. Bundan sonra Claude bu bilgisayarda komut
çalıştıramaz.

### 1. PowerShell'i yönetici olarak aç

Başlat menüsüne **PowerShell** yaz, **Windows PowerShell**'e sağ tıkla, **Yönetici olarak çalıştır**.

### 2. Bu kodu yapıştır, Enter'a bas

SSH sunucusunu durdurur, bilgisayar açılınca bir daha başlamaz, güvenlik duvarındaki SSH kuralını kapatır ve Claude'un
anahtarını siler.

```powershell
Stop-Service sshd
Set-Service -Name sshd -StartupType Disabled
Disable-NetFirewallRule -Name "OpenSSH-Server-In-TCP"
foreach ($file in "$env:ProgramData\ssh\administrators_authorized_keys", "$env:USERPROFILE\.ssh\authorized_keys") { if (Test-Path $file) { $rest = @(Get-Content $file | Where-Object { $_ -notlike "*claude-code-mac-to-winpc*" }); Set-Content -Path $file -Value $rest -Encoding ascii } }
Get-Service sshd | Select-Object Status, StartType
```

- En sonda **Stopped** ve **Disabled** görünmeli.
- Yeniden açmak istersen Claude'a söyle: adımları buraya yazar.
