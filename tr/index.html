                <h1>Buğra Özden</h1>
                <p>İstanbul'daki, Türkiye genelindeki ve yurt dışındaki müşterilerle uzaktan çalışan freelance web ve uygulama geliştirici. İnteraktif web uygulamaları, özel yönetim panelleri, dashboard'lar ve gelişmiş web formları.</p>

                <h2>Hizmetler</h2>

                <h3>Özel Yönetim Panelleri ve Dashboard'lar</h3>
                <p>İşletmenize özel bir yönetim paneli: siparişler, müşteriler, ürünler, raporlar ve cihazlardan gelen canlı veriler tek ekranda. Yalnızca ihtiyacınız olan sayfalar, sizin renklerinizle. Grafikler, veri tabloları, filtreler ve dışa aktarma hazır; yeni modüller, paneli baştan yazmadan sonradan eklenebilir. Tarayıcıda çalışır, kurulum gerektirmez. <a href="https://bug7a.github.io/admin-panel" style="color: #A78BFA;">İnternet Sitesi</a> · <a href="https://bug7a.github.io/admin-panel-example" style="color: #A78BFA;">Canlı örnek</a></p>

                <h3>Gelişmiş Web Formları</h3>
                <p>Yalnızca yazı toplamaktan fazlasını yapan formlar: randevu, sipariş, etkinlik bileti, iş başvurusu, destek talebi ve müşteri geri bildirimi. Ziyaretçi yazarken her alan kendini kontrol eder, gönder düğmesi neyin eksik olduğunu gösterir. Cevaplar e-postanıza ya da veritabanınıza gelir ve form her web sitesine yerleştirilebilir. <a href="https://bug7a.github.io/web-forms" style="color: #A78BFA;">İnternet Sitesi</a> · <a href="tr/#contact" style="color: #A78BFA;">Canlı örnek</a></p>

                <h2>Projeler</h2>

                <h3>Kodlama: Kod Yazma Eğitimi</h3>
                <p>Çocuklara, gerçek bir programlama dili (JavaScript) kullanarak algoritma geliştirme ve problem çözme deneyimi kazandıran, bulmaca oyunu tarzında bir eğitim uygulaması. <a href="https://bug7a.github.io/kodlama/" style="color: #A78BFA;">İnternet Sitesi</a> · <a href="https://bug7a.github.io/kodlama-egitimi/" style="color: #A78BFA;">Eğitim</a> · <a href="https://github.com/bug7a/basicjs-turkce/" style="color: #A78BFA;">Örnek Projeler</a></p>

                <h3>The Fallen Kingdoms</h3>
                <p>Sıra tabanlı strateji ile kart seçme mekaniklerini birleştiren bir kutu oyunu. Steam'de "Remote Play Together" destekleyen bir parti oyunu. <a href="https://store.steampowered.com/app/2923920?utm_source=bugraozden" style="color: #A78BFA;">Steam'de gör</a></p>

                <h3>Kişisel Harcama Defteri</h3>
                <p>Bir bütçe belirleyip harcamaları kategorilere göre takip etmeye yarayan bir mobil uygulama. <a href="https://bug7a.github.io/expense/" style="color: #A78BFA;">Önizleme</a></p>

                <h3>Closed-Loop Marketing</h3>
                <p>İlaç firmalarının saha ekipleri için mobil (iOS) CLM (Closed-Loop Marketing) uygulaması. Roche, Novo Nordisk ve Boehringer Ingelheim'da 500'den fazla tıbbi temsilci, doktor ziyaretlerinde kullandı: doktorlara sunumlar, ziyaret verileri ve eğitimler tek bir uygulamada.</p>
